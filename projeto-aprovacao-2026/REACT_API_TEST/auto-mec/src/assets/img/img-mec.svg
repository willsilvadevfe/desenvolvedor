<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Recorte Circular Principal da Imagem -->
    <clipPath id="circleClip">
      <circle cx="300" cy="300" r="285"/>
    </clipPath>

    <!-- Gradientes Metálicos e de Fundo -->
    <radialGradient id="blueRadialBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="90%" stop-color="#070D1B"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <linearGradient id="pistonSteelPro" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="15%" stop-color="#94A3B8"/>
      <stop offset="40%" stop-color="#F8FAFC"/>
      <stop offset="65%" stop-color="#CBD5E1"/>
      <stop offset="85%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="skirtCoating" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="rodBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="cyanTechGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Gradiente Suave da Fumaça -->
    <radialGradient id="smokeSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#94A3B8" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#475569" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </radialGradient>

    <!-- Explosão / Faísca da Vela -->
    <radialGradient id="combustionSpark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FDE047"/>
      <stop offset="75%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Filtros de Brilho -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Estilos e Animações CSS -->
  <style>
    /* Movimento do Virabrequim (360 graus) */
    .rotate-crank {
      animation: spinCrank 1.2s linear infinite;
      transform-origin: 300px 430px;
    }
    @keyframes spinCrank {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Trajeto Vertical do Pistão (Ciclo Real) */
    .piston-stroke {
      animation: strokeCycle 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    @keyframes strokeCycle {
      0% { transform: translateY(0px); }
      50% { transform: translateY(70px); }
      100% { transform: translateY(0px); }
    }

    /* Articulação da Biela */
    .rod-swing {
      animation: swingCycle 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      transform-origin: 300px 230px;
    }
    @keyframes swingCycle {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(15deg); }
      50% { transform: rotate(0deg); }
      75% { transform: rotate(-15deg); }
      100% { transform: rotate(0deg); }
    }

    /* Faísca de Ignição */
    .spark-flash {
      animation: flashPulse 1.2s infinite;
      transform-origin: 300px 125px;
    }
    @keyframes flashPulse {
      0% { opacity: 1; transform: scale(1.4); }
      14% { opacity: 0; transform: scale(0.2); }
      100% { opacity: 0; transform: scale(0.2); }
    }

    /* Animação da Fumaça Subindo e Expandindo */
    .smoke-p1 { animation: smokeFlowA 2.4s ease-out infinite; }
    .smoke-p2 { animation: smokeFlowB 2.4s ease-out infinite 0.6s; }
    .smoke-p3 { animation: smokeFlowC 2.4s ease-out infinite 1.2s; }
    .smoke-p4 { animation: smokeFlowD 2.4s ease-out infinite 1.8s; }

    @keyframes smokeFlowA {
      0% { transform: translate(280px, 120px) scale(0.4); opacity: 0; }
      20% { opacity: 0.7; }
      100% { transform: translate(210px, 10px) scale(2.4); opacity: 0; }
    }
    @keyframes smokeFlowB {
      0% { transform: translate(300px, 115px) scale(0.5); opacity: 0; }
      25% { opacity: 0.8; }
      100% { transform: translate(300px, -10px) scale(2.8); opacity: 0; }
    }
    @keyframes smokeFlowC {
      0% { transform: translate(320px, 120px) scale(0.4); opacity: 0; }
      20% { opacity: 0.6; }
      100% { transform: translate(380px, 15px) scale(2.2); opacity: 0; }
    }
    @keyframes smokeFlowD {
      0% { transform: translate(295px, 110px) scale(0.5); opacity: 0; }
      30% { opacity: 0.7; }
      100% { transform: translate(260px, -20px) scale(2.6); opacity: 0; }
    }

    /* Pulsação Suave dos Anéis Tecnológicos */
    .hud-ring {
      animation: hudRotate 20s linear infinite;
      transform-origin: 300px 300px;
    }
    @keyframes hudRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- MOLDURA E CONTEÚDO DENTRO DO CÍRCULO -->
  <g clip-path="url(#circleClip)">

    <!-- Fundo Azul Gradiente Profundo -->
    <rect width="600" height="600" fill="url(#blueRadialBg)"/>

    <!-- Grade Tecnológica de Fundo -->
    <g stroke="#0284C7" stroke-width="1" opacity="0.18">
      <line x1="100" y1="0" x2="100" y2="600"/>
      <line x1="200" y1="0" x2="200" y2="600"/>
      <line x1="300" y1="0" x2="300" y2="600"/>
      <line x1="400" y1="0" x2="400" y2="600"/>
      <line x1="500" y1="0" x2="500" y2="600"/>
      <line x1="0" y1="100" x2="600" y2="100"/>
      <line x1="0" y1="200" x2="600" y2="200"/>
      <line x1="0" y1="300" x2="600" y2="300"/>
      <line x1="0" y1="400" x2="600" y2="400"/>
      <line x1="0" y1="500" x2="600" y2="500"/>
    </g>

    <!-- Anéis HUD Circulares e Graduações -->
    <g class="hud-ring" opacity="0.35">
      <circle cx="300" cy="300" r="270" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="12 16 30 16"/>
      <circle cx="300" cy="300" r="255" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="60 120"/>
    </g>

    <!-- ==================== CILINDRO E BLOCO DO MOTOR ==================== -->
    <g id="engineCylinder">
      <!-- Aletas Exteriores de Refrigeração -->
      <g fill="#0F172A" stroke="#0284C7" stroke-width="1.5" opacity="0.9">
        <rect x="180" y="140" width="240" height="12" rx="4"/>
        <rect x="180" y="168" width="240" height="12" rx="4"/>
        <rect x="180" y="196" width="240" height="12" rx="4"/>
        <rect x="180" y="224" width="240" height="12" rx="4"/>
        <rect x="180" y="252" width="240" height="12" rx="4"/>
        <rect x="180" y="280" width="240" height="12" rx="4"/>
      </g>

      <!-- Paredes da Camisa do Cilindro -->
      <rect x="210" y="120" width="18" height="230" rx="3" fill="url(#pistonSteelPro)"/>
      <rect x="372" y="120" width="18" height="230" rx="3" fill="url(#pistonSteelPro)"/>

      <!-- Brunimento Cruzado da Camisa (Hone Marks) -->
      <g stroke="#38BDF8" stroke-width="1" opacity="0.25">
        <line x1="228" y1="130" x2="372" y2="200"/>
        <line x1="228" y1="180" x2="372" y2="250"/>
        <line x1="228" y1="230" x2="372" y2="300"/>
        <line x1="372" y1="130" x2="228" y2="200"/>
        <line x1="372" y1="180" x2="228" y2="250"/>
        <line x1="372" y1="230" x2="228" y2="300"/>
      </g>

      <!-- Cabeçote Superior do Motor -->
      <rect x="190" y="85" width="220" height="35" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="2"/>

      <!-- Vela de Ignição Profissional -->
      <g id="sparkPlug">
        <rect x="293" y="45" width="14" height="25" fill="#F8FAFC" rx="2"/> <!-- Cerâmica -->
        <rect x="288" y="70" width="24" height="18" fill="url(#pistonSteelPro)" rx="2"/> <!-- Sextavado -->
        <rect x="297" y="88" width="6" height="14" fill="#F97316"/> <!-- Eletrodo -->
      </g>

      <!-- EFEITO DE FUMAÇA ANIMADA -->
      <g id="smokeGroup">
        <circle class="smoke-p1" cx="0" cy="0" r="30" fill="url(#smokeSoft)"/>
        <circle class="smoke-p2" cx="0" cy="0" r="38" fill="url(#smokeSoft)"/>
        <circle class="smoke-p3" cx="0" cy="0" r="28" fill="url(#smokeSoft)"/>
        <circle class="smoke-p4" cx="0" cy="0" r="34" fill="url(#smokeSoft)"/>
      </g>

      <!-- Faísca de Combustão -->
      <circle class="spark-flash" cx="300" cy="118" r="32" fill="url(#combustionSpark)" filter="url(#neonGlow)"/>

      <!-- Virabrequim Forjado em Rotação -->
      <g class="rotate-crank">
        <!-- Contrapesos do Virabrequim -->
        <path d="M 240 430 A 60 60 0 0 1 360 430 L 335 480 A 45 45 0 0 1 265 480 Z" fill="url(#pistonSteelPro)" stroke="#0F172A" stroke-width="2"/>
        <!-- Furos de Balanceamento Usinados -->
        <circle cx="275" cy="455" r="9" fill="#070D1B"/>
        <circle cx="325" cy="455" r="9" fill="#070D1B"/>
        <!-- Eixo Central -->
        <circle cx="300" cy="430" r="24" fill="#0F172A" stroke="#334155" stroke-width="2"/>
        <!-- Pino do Virabrequim (Crankpin) -->
        <circle cx="300" cy="395" r="15" fill="#F97316" stroke="#FFFFFF" stroke-width="2"/>
      </g>

      <!-- BIELA (CONNECTING ROD H-BEAM DE COMPETIÇÃO) -->
      <g class="piston-stroke">
        <g class="rod-swing">
          <!-- Corpo Principal H-Beam -->
          <path d="M 287 230 L 280 395 L 320 395 L 313 230 Z" fill="url(#pistonSteelPro)" stroke="#1E293B" stroke-width="2"/>
          <!-- Vínculo Central H-Beam -->
          <path d="M 291 245 L 286 380 L 314 380 L 309 245 Z" fill="#0F172A"/>
          
          <!-- Bucha de Bronze no Olho Menor -->
          <circle cx="300" cy="230" r="19" fill="url(#pistonSteelPro)"/>
          <circle cx="300" cy="230" r="13" fill="url(#rodBronze)"/>
          <circle cx="300" cy="230" r="9" fill="#070D1B"/>

          <!-- Parafusos da Capa da Biela -->
          <circle cx="275" cy="395" r="3.5" fill="#FFFFFF"/>
          <circle cx="325" cy="395" r="3.5" fill="#FFFFFF"/>
        </g>
      </g>

      <!-- ==================== PISTÃO ULTRADETALHADO ==================== -->
      <g class="piston-stroke">
        <!-- Corpo Forjado em Alumínio -->
        <path d="M 228 140 
                 Q 300 130 372 140 
                 L 372 218 
                 Q 372 228 360 228 
                 L 342 228 L 342 208 L 258 208 L 258 228 L 240 228 
                 Q 228 228 228 218 Z" 
              fill="url(#pistonSteelPro)" stroke="#0F172A" stroke-width="2"/>

        <!-- Cavas das Válvulas na Cabeça do Pistão -->
        <path d="M 245 140 Q 265 148 285 140" fill="none" stroke="#334155" stroke-width="3"/>
        <path d="M 315 140 Q 335 148 355 140" fill="none" stroke="#334155" stroke-width="3"/>

        <!-- Conjunto de Anéis do Pistão (3 Anéis) -->
        <!-- Anel 1: Compressão Superior -->
        <rect x="226" y="152" width="148" height="3" fill="#1E293B"/>
        <!-- Anel 2: Raspador Intermediário -->
        <rect x="226" y="160" width="148" height="3" fill="#1E293B"/>
        <!-- Anel 3: Anel de Óleo com Mola Expansora -->
        <rect x="226" y="168" width="148" height="4" fill="#0284C7"/>

        <!-- Saia do Pistão com Revestimento de Anti-Atrito (Moly-Coat) -->
        <rect x="230" y="180" width="14" height="32" rx="3" fill="url(#skirtCoating)"/>
        <rect x="356" y="180" width="14" height="32" rx="3" fill="url(#skirtCoating)"/>

        <!-- Rebaixo Lateral e Furos de Lubrificação -->
        <circle cx="237" cy="190" r="2" fill="#38BDF8"/>
        <circle cx="363" cy="190" r="2" fill="#38BDF8"/>

        <!-- Pino de Embolo (Wrist Pin) e Trava Circlip -->
        <circle cx="300" cy="198" r="18" fill="#1E293B" stroke="#475569" stroke-width="2"/>
        <circle cx="300" cy="198" r="12" fill="url(#pistonSteelPro)"/>
        <circle cx="300" cy="198" r="6" fill="#070D1B"/>
        <!-- Anel de Trava Trava Circlip -->
        <circle cx="300" cy="198" r="15" fill="none" stroke="#F97316" stroke-width="1.5" stroke-dasharray="8 4"/>
      </g>

    </g> <!-- Fim do Motor -->

  </g> <!-- Fim do Recorte Circular -->

  <!-- Borda Circular Externa em Destaque Neon Azul -->
  <circle cx="300" cy="300" r="285" fill="none" stroke="#38BDF8" stroke-width="6" filter="url(#neonGlow)"/>
  <circle cx="300" cy="300" r="285" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
</svg>
