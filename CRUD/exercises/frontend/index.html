<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Cursos</title>
  </head>
  <body>
    <h1>Cadastro de Cursos</h1>

    <form id="formCurso">
      <label for="nome">Nome do curso:</label>
      <input type="text" id="nome" name="nome" required />

      <br /><br />

      <label for="duracao">Duração (horas):</label>
      <input type="number" id="duracao" name="duracao" min="1" required />

      <br /><br />

      <button type="submit">Cadastrar curso</button>
    </form>

    <p id="mensagem"></p>

    <script>
      const formulario = document.getElementById("formCurso");
      const mensagem = document.getElementById("mensagem");

      formulario.addEventListener("submit", async (event) => {
        event.preventDefault();

        const nome = document.getElementById("nome").value;
        const duracao = Number(document.getElementById("duracao").value);

        try {
          const resposta = await fetch("http://localhost:3000/cursos", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              nome: nome,
              duracao: duracao,
            }),
          });

          const dados = await resposta.json();

          if (!resposta.ok) {
            throw new Error(
              dados.erro || dados.mensagem || "Falha no cadastro",
            );
          }

          mensagem.textContent = dados.mensagem;
          formulario.reset();
        } catch (erro) {
          mensagem.textContent = "Erro: " + erro.message;
        }
      });
    </script>
  </body>
</html>
